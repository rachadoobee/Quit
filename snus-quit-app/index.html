<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>QuitSnus</title>

  <!-- PWA manifest + iOS install hints -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#22c55e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="QuitSnus" />
  <link rel="apple-touch-icon" href="icons/icon-192.svg" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app-shell">
    <!-- Header (hidden during onboarding) -->
    <header id="app-header">
      <span class="app-title">QuitSnus</span>
      <button id="settings-cog" aria-label="Settings">⚙️</button>
    </header>

    <!-- Active screen renders here -->
    <main id="app-main"></main>

    <!-- Bottom navigation (hidden during onboarding) -->
    <nav id="bottom-nav">
      <button class="nav-item active" data-tab="home">
        <span class="nav-icon">🏠</span><span class="nav-label">Home</span>
      </button>
      <button class="nav-item" data-tab="progress">
        <span class="nav-icon">📊</span><span class="nav-label">Progress</span>
      </button>
      <button class="nav-item" data-tab="history">
        <span class="nav-icon">📜</span><span class="nav-label">History</span>
      </button>
      <button class="nav-item" data-tab="settings">
        <span class="nav-icon">⚙️</span><span class="nav-label">Settings</span>
      </button>
    </nav>
  </div>

  <!-- Overlays -->
  <div id="toast-root"></div>
  <div id="modal-root"></div>

  <!-- Chart.js from CDN (cached by the service worker after first load) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

  <!-- App scripts: order matters — dependencies load before app.js -->
  <script src="js/db.js"></script>
  <script src="js/taper.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
