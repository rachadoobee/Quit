<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Rounded green background so the icon sits inside the app tile -->
  <rect width="512" height="512" rx="112" fill="#22c55e"/>
  <!-- No symbol: ring + diagonal backslash, inset to leave a margin -->
  <g fill="none" stroke="#ffffff" stroke-width="42" stroke-linecap="round">
    <circle cx="256" cy="256" r="144"/>
    <!-- Backslash across the ring (top-left to bottom-right) -->
    <line x1="154" y1="154" x2="358" y2="358"/>
  </g>
</svg>
